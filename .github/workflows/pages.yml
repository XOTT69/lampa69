name: Build and publish XOTT TV
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xott-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yumata/lampa-source
          ref: 616c80224518a7c7e04e2789d5811881b93bf611
          path: .upstream
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: upstream-lock.json
      - name: Install pinned build dependencies
        run: |
          cp upstream-lock.json .upstream/package-lock.json
          npm ci --prefix .upstream --ignore-scripts --no-audit --no-fund
      - name: Build application
        env:
          SITE_URL: https://xott69.github.io/lampa69/
        run: npm run build
      - name: Verify build and bootstrap
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: xott-tv-static
          path: dist
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
